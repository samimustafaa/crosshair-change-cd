name: Build Windows EXE and publish release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Native Lab dependencies before testing
        run: python -m pip install --disable-pip-version-check pillow lz4 psutil mss numpy

      - name: Check Python syntax
        run: python -m py_compile sg0hann_crosshair.py updater.py aim_state.py build_state.py interface.py native_assets.py native_panel.py game_status.py reactive_spread.py vision_assist.py

      - name: Test aim, build and crosshair behavior
        run: python -m unittest discover -s tests -v

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import sg0hann_crosshair; print(sg0hann_crosshair.VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid app version' }
          "number=$version" >> $env:GITHUB_OUTPUT

      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller pillow lz4 psutil mss numpy

      - name: Build crosshair app with installed Python runtime
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --noupx --name sg0hann-Crosshair sg0hann_crosshair.py

      - name: Smoke test bundled app and Python DLL
        shell: pwsh
        run: |
          $exe = 'dist/sg0hann-Crosshair/sg0hann-Crosshair.exe'
          $dll = 'dist/sg0hann-Crosshair/_internal/python312.dll'
          if (!(Test-Path $exe)) { throw 'Bundled crosshair executable is missing' }
          if (!(Test-Path $dll)) { throw 'Bundled Python 3.12 DLL is missing' }
          $process = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Bundled app smoke test failed with code $($process.ExitCode)" }


      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows setup EXE
        shell: pwsh
        run: |
          $installerCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $installerCompiler)) { throw 'Inno Setup compiler not found' }
          & $installerCompiler "/DMyAppVersion=${{ steps.version.outputs.number }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Create SHA256 checksum file
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/sg0hann-Crosshair-Setup.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sg0hann-Crosshair-Setup.exe" | Set-Content -Path 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Package portable folder with Python runtime
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/sg0hann-Crosshair/*' -DestinationPath 'dist/sg0hann-Crosshair-Portable.zip' -CompressionLevel Optimal

      - name: Upload installer and portable folder as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sg0hann-Crosshair-Windows
          path: |
            dist/sg0hann-Crosshair-Portable.zip
            dist/sg0hann-Crosshair-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release for new version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Bump VERSION to publish the next update."
          } else {
            gh release create $tag 'dist/sg0hann-Crosshair-Setup.exe' 'dist/sg0hann-Crosshair-Portable.zip' 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --title "sg0hann Crosshair Color Lab $tag" --notes "v1.1.0: per-weapon shotgun and AR bloom, separate Sniper scope mode, adjustable ADS shrinking and optional confidence-gated white reticle screen tracking with baseline calibration. No claimed accuracy percentage."
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          }
